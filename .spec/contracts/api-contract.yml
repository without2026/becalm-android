version: 1
# Boundary reference: docs/becalm-mvp-boundary.md
# BeCalm Android MVP — API Contract (client_primary profile)
#
# TWO API surfaces:
#   1. Supabase Auth  — base: https://<supabase-project>.supabase.co  (client calls directly for Auth only)
#   2. Railway API    — base: ${BECALM_API_BASE_URL} (BuildConfig; all data R/W goes through here)
#
# Android does NOT call Supabase REST (rest/v1/*) directly for data.
# All commitments, raw events, and calendar data flow through Railway.
# Railway holds the Supabase service_role key; Android sends only its Supabase JWT as Bearer.
# Today/Settings의 SourceStatusStrip, SourcesList, OverallSyncIndicator는 Railway `GET /v1/source_status`
# 값을 우선 merge하고, 네트워크/서버 실패 시 Android local-derived state로 fallback한다. voice처럼 Android-only
# runtime 상태가 더 정확한 source는 로컬 기록(recordSyncStart/Success/Error)이 동일 cache를 갱신한다.
# 사용자-facing status 대상 source는 10개(voice, meeting, message_screenshot, manual_text, gmail, outlook_mail,
# naver_imap, daum_imap, google_calendar, outlook_calendar)이며, call_recording은 voice pipeline provenance subtype으로만 남고
# 별도 status chip을 만들지 않는다.
#
# Error envelope for all Railway endpoints:
#   4xx/5xx: { error: string, message: string, request_id?: string, retryable?: boolean, retry_after_seconds?: int, client_action?: string }
# Android must not infer retryability from status code alone when retryable/client_action are present.
# Beta cutover rule:
#   - Every Android-facing Railway endpoint consumed during beta MUST return ErrorEnvelope for non-2xx.
#   - Legacy {error,message} shapes are tolerated only if Android ApiErrorNormalizer maps them to ClientRecoverableError.
#   - Empty/malformed 5xx/429/network errors are retryable by default and must not crash UI or workers.
#   - A non-retryable error must carry a user repair, support, upgrade, discard, or feature-disable path.
# client_action values:
#   retry_later | full_refresh | login | reconnect_source | open_source_settings | review_quarantine |
#   refresh_action | discard_local_mutation | fix_input | upgrade_app | contact_support |
#   disable_feature | force_upgrade | maintenance_wait | report_issue
# Rate limiting: HTTP 429 with Retry-After header (seconds).
# Write success semantics for every Railway insert/update endpoint:
#   - HTTP 200/201 = durable commit completed in user-scoped server storage.
#   - HTTP 202 = accepted/queued only and MUST NOT be treated as synced by Android.
#   - Batch write endpoints MUST return row-level results keyed by client-generated ids; count-only ack is forbidden.
#
# Robust backend API rules for the person-action feed:
#   - A source/commitment/calendar/person/correction write that returns durable success and can affect actions
#     must have already enqueued or coalesced backend recomputation.
#   - GET /v1/person_action_items delta responses are snapshot-consistent and include rows, deleted_ids,
#     server_watermark, input_watermarks, and recompute_state together.
#   - PATCH/feedback requests use client_mutation_id as the idempotency key. Same key+payload returns the
#     committed result; same key with different payload returns 409 idempotency_conflict.
#   - Android advances person_action_sync_state watermarks only after transactional apply and never locally generates
#     replacement actions on 404/429/503.
#   - Retryability is contract data carried by ErrorEnvelope/Retry-After, not a client guess from status code.
#
# REST + CRUD ownership pattern:
#   - Source origin and product-decision ownership are separate.
#   - Android Room/local files are the canonical client-side source of truth for device-owned
#     source originals, mutation outboxes, and local projection caches.
#   - Backend Railway is the product decision owner for person action items: urgency, grouping,
#     ranking, and action state are computed server-side and mirrored into Android cache.
#   - Resource endpoints are CRUD mirrors/coordinators for source facts. Android writes local-origin
#     rows locally first, marks rows
#     sync_status='pending', then mirrors bounded structured context via Railway REST. UI may render
#     only the last backend-computed action cache while sync is pending.
#   - Resource create/update/delete must be represented as POST/PATCH/DELETE-or-soft-delete on
#     resource endpoints, never as ad hoc command endpoints.
#   - Command endpoints are reserved for non-resource work such as extraction, provider sync,
#     rebuild, and generation. They use POST /v1/{resource}:{action} and do not own canonical rows.
#   - Raw/private bytes, OCR text, full transcript, and raw LLM output are never REST resources
#     and must not be persisted in Supabase/Railway.

base_path: ${BECALM_API_BASE_URL}
auth: bearer_jwt

# Shared types
types:
  ErrorEnvelope:
    error: string
    message: string
    request_id?: string
    retryable?: boolean
    retry_after_seconds?: int
    client_action?: string

  FailedEvent:
    client_event_id: uuid       # 실패한 이벤트의 멱등 키
    reason: string              # "schema_invalid" | "source_type_unknown" | "timestamp_parse_error" | "internal_error"
    message: string             # 사람이 읽을 수 있는 상세
    retryable: boolean          # true면 client가 재시도, false면 quarantine

  BatchWriteResult:
    client_event_id: uuid       # Android가 생성한 멱등 키. Room row 상태 갱신의 기준 키
    disposition: string         # "inserted" | "duplicate" — 둘 다 durable commit success
    committed_at: datetime      # 서버 durable commit 완료 시각 (UTC)

  SourceStatusItem:
    owner: railway_first_with_android_fallback
    source_id: string           # voice | call_recording | meeting | message_screenshot | gmail | outlook_mail | naver_imap | daum_imap | google_calendar | outlook_calendar
    label: string               # Voice | Meetings | Messenger Captures | Gmail | Outlook Mail | Naver Email | Daum Email | Google Calendar | Outlook Calendar
    connection_state: string    # connected | never_connected | needs_reauth | client_managed
    sync_state: string          # idle | syncing | error | synced
    visual_state: string        # legacy UI projection of sync_state
    last_sync_at?: datetime
    last_error?: string
    events_synced_count?: int
    # Railway가 provider-owned/server-visible source 상태를 반환한다. Android는 이 값을 DataStore cache에 merge한다.
    # 실패/오프라인 시 DataStore connection flags/cursors, Keystore credential 또는 Android local MediaStore path selection 존재 여부,
    # WorkManager/runtime sync 상태, Room 보조 메타데이터를 조합한 local-derived cache가 fallback으로 쓰인다.

  LocalDerivedContactsSourceStatus:
    owner: android_client_only
    source_id: string           # contacts
    connection_state: string    # connected | disconnected
    enriched_count?: int
    last_sync_at?: datetime
    # contacts는 Railway API surface가 아니다. READ_CONTACTS permission + Room persons_enrichment 기반 로컬 파생 row다.

  SourceEventParticipantInput:
    role: string                 # self | sender | recipient | cc | bcc | caller | receiver | organizer | attendee | speaker | mentioned | referenced | counterparty
    relation_to_user: string     # self | counterparty | participant | referenced | unknown
    identity_type?: string       # email | phone | name | organization
    raw_value?: string           # source metadata/body에서 본 원본 값
    normalized_value?: string    # email lowercase, E.164 phone, normalized name/org
    display_name?: string
    email?: string
    phone?: string
    organization?: string
    title?: string               # explicitly stated job title/role only; no inference from work context
    evidence?: string
    confidence: float            # 0.0 ~ 1.0
    evidence_source: string      # metadata | body | llm | contact | call_log | filename

  SourceEventInput:
    client_event_id: uuid
    source_type: string
    source_ref?: string
    conversation_ref?: string
    event_title?: string
    event_snippet?: string
    duration_seconds?: int
    location?: string
    folder?: string
    commitments_extracted_count?: int
    email_body_plain?: string
    previous_thread_context?: string
    timestamp: datetime
    participants?: "SourceEventParticipantInput[]"
    counterparty_ref?: string
    # counterparty_ref는 compatibility seed다. Person/relation 생성의 canonical input은 participants[]다.

  CalendarOAuthStart:
    provider: string
    authorization_url: string
    redirect_uri: string
    state: string

  CalendarOAuthStatus:
    provider: string
    connected: boolean
    account_email?: string
    display_name?: string
    sync_state?: string          # idle | queued | running | synced | needs_reauth | failed_retryable | failed_terminal
    job_id?: uuid
    retry_after_seconds?: int
    last_sync_at?: datetime
    last_error_code?: string
    # connected=true means token/connection row exists. synced requires terminal provider fetch + durable persistence + Android mirror refresh.

  MailOAuthStart:
    provider: string
    authorization_url: string
    redirect_uri: string
    state: string

  MailOAuthStatus:
    provider: string
    connected: boolean
    account_email?: string
    display_name?: string
    sync_state?: string          # idle | queued | running | synced | needs_reauth | failed_retryable | failed_terminal
    job_id?: uuid
    retry_after_seconds?: int
    last_sync_at?: datetime
    last_error_code?: string
    # connected=true means token/connection row exists. synced requires terminal provider fetch + durable persistence + Android mirror refresh.

  SourceSyncTriggerResponse:
    accepted: boolean
    synced?: int                 # legacy compatibility count; not sufficient for terminal sync proof
    job_id?: uuid
    status: string               # queued | running | succeeded | retry | needs_reauth | failed_terminal
    retry_after_seconds?: int
    source_type?: string
    provider?: string
    counts?: object
    # Android treats accepted/queued/running as background work only. It must not mark source synced or refresh action watermarks until terminal succeeded + mirror refresh.

  SourceExtractedItem:
    type: string              # "action" | "schedule" | "decision"
    text: string              # 원문 언어를 유지한 정규화 문구
    quote: string             # source에서 추출한 verbatim 근거 단편(<=100 chars, 원문 언어 유지)
    person_ref?: string       # 정규화된 상대방 식별자. 1:1은 해당 counterparty, N:M은 item별 명시 근거가 있을 때만 설정. 식별 불가/모호하면 null
    due_at?: datetime         # ISO8601 with explicit +09:00 offset (KST) or null
    due_hint?: string         # 원문 시점 표현(원문 언어 유지)
    due_is_approximate: bool
    confidence: float         # 0.0 ~ 1.0
    direction?: string        # type=action 일 때만 "give" | "take"
    schedule_status?: string  # type=schedule 일 때만 "confirmed" | "changed" | "postponed" | "cancelled" | "follow_up"
    decision_status?: string  # type=decision 일 때만 "approved" | "rejected" | "chosen" | "deferred" | "ongoing"

  Commitment:
    id: uuid
    user_id: uuid
    item_type: string          # action | schedule | decision
    direction?: string         # item_type=action 일 때만 give | take
    schedule_status?: string   # item_type=schedule 일 때만 confirmed | changed | postponed | cancelled | follow_up
    decision_status?: string   # item_type=decision 일 때만 approved | rejected | chosen | deferred | ongoing
    counterparty_raw?: string
    counterparty_ref?: string
    title: string
    description?: string
    quote: string
    source_event_title?: string
    source_event_occurred_at: datetime
    due_at?: datetime
    due_hint?: string
    due_is_approximate: boolean
    action_state: string       # action rows lifecycle; non-action rows use storage sentinel
    source_type: string
    source_ref?: string
    confidence: float
    created_at: datetime
    updated_at: datetime
    last_edited_by?: uuid
    last_edited_at?: datetime
    quote_disputed: boolean
    quote_disputed_at?: datetime
    deleted_at?: datetime
    supersedes_commitment_id?: uuid

  PersonActionEvidenceRef:
    kind: string              # commitment | calendar_event | source_event | source_participant | commitment_participant | person_memory | source_status | user_correction
    id: string
    source_ref?: string
    occurred_at?: datetime
    label: string             # <=80 chars
    quote?: string            # <=200 chars; never full body/transcript/OCR/raw model output/local path

  PersonActionItem:
    id: string                # deterministic stable id; sha256 of user/action/evidence identity/action_version
    user_id: uuid
    person_id?: uuid
    person_display_name?: string
    person_sort_key?: string
    surfaces: "string[]"      # person | schedule | commitment
    action_kind: string       # do_work | attend | prepare | reply | follow_up | wait | confirm_schedule | review_person | review_extraction | source_reconnect
    status: string            # active | completed | dismissed | snoozed | superseded | stale
    title: string             # Korean-first, <=120 chars
    primary_verb: string      # <=20 chars
    short_reason: string      # <=160 chars
    commitment_id?: uuid
    calendar_event_id?: uuid
    source_event_id?: uuid
    source_type?: string
    source_ref?: string
    due_at?: datetime
    due_hint?: string
    due_is_approximate: boolean
    stale_after?: datetime
    urgency_score: float
    importance_score: float
    confidence: float
    reason_codes: "string[]"
    evidence_refs: "PersonActionEvidenceRef[]"
    input_watermark: datetime
    input_watermarks: "PersonActionInputWatermark[]"
    computed_at: datetime
    updated_at: datetime
    snoozed_until?: datetime
    completed_at?: datetime
    dismissed_at?: datetime

  PersonActionStatePatch:
    client_mutation_id: uuid   # Android-generated idempotency key; stable across retries
    status: string            # completed | dismissed | snoozed | active
    snoozed_until?: datetime  # required when status=snoozed
    reason?: string
    expected_updated_at?: datetime # optional optimistic concurrency guard
    updated_at: datetime

  PersonActionFeedback:
    client_mutation_id: uuid   # Android-generated idempotency key; stable across retries
    feedback_type: string     # wrong_person | wrong_priority | not_actionable | missing_context | useful | other
    reason?: string
    corrected_person_id?: uuid
    corrected_due_at?: datetime
    updated_at: datetime

  PersonActionInputWatermark:
    input_kind: string         # source_event | commitment | calendar_event | person_graph | person_memory | source_status | user_correction
    source_type?: string
    high_watermark: datetime
    row_count?: int
    digest?: string            # bounded hash/fingerprint only; never raw content

  PersonActionRecoveryAction:
    kind: string               # retry_now | full_refresh | open_source_settings | reconnect_source | review_quarantine | refresh_action | discard_mutation | upgrade_app | contact_support
    label: string              # user-facing CTA label, localized by Android when possible
    source_id?: string
    action_item_id?: string
    mutation_id?: uuid
    reason_code?: string

  PersonActionCapacityState:
    state: string              # normal | backlog | degraded
    backlog_lag_seconds?: int
    last_caught_up_at?: datetime
    incident_id?: string       # non-secret operator-visible id when degraded

  PersonActionEmptyState:
    state: string              # no_action_caught_up | setup_required | sync_pending | feature_disabled | maintenance | endpoint_unavailable
    title?: string
    message?: string
    source_id?: string
    reason_code?: string
    recovery_actions?: "PersonActionRecoveryAction[]"

  PersonActionFeedResponse:
    data: "PersonActionItem[]"
    deleted_ids: "string[]"    # action ids deleted/superseded since changed_since; Android must tombstone cache rows
    cursor?: string             # present when has_more=true; bound to snapshot_id for action-feed pages
    has_more: boolean
    snapshot_id?: string       # required when has_more=true; binds paginated full refresh/delta pages to one backend snapshot
    snapshot_expires_at?: datetime
    watermark_scope?: string   # main_feed | filtered_history. Android advances main cache watermark only for main_feed.
    server_watermark: datetime # advance only after transactional cache apply
    input_watermarks: "PersonActionInputWatermark[]"
    recompute_state: string    # caught_up | pending | stale | degraded
    capacity_state?: "PersonActionCapacityState"
    changed_since_min?: datetime # earliest watermark still covered by tombstones; older clients must full refresh
    tombstone_window_days?: int
    recovery_actions?: "PersonActionRecoveryAction[]" # required when recompute_state is stale/degraded or pending needs user repair
    empty_state?: "PersonActionEmptyState" # required when data=[] and no cached rows can explain the product state

  ClientFeatureFlags:
    action_feed_enabled: boolean
    person_action_mutations_enabled: boolean
    gmail_enabled: boolean
    outlook_mail_enabled: boolean
    google_calendar_enabled: boolean
    outlook_calendar_enabled: boolean
    naver_imap_enabled: boolean
    daum_imap_enabled: boolean
    meeting_ingestion_enabled: boolean
    message_screenshot_enabled: boolean

  ClientRuntimeConfigResponse:
    environment: string           # dev | staging | production
    server_time: datetime
    min_supported_version_code: int
    latest_version_code?: int
    force_upgrade: boolean
    maintenance_mode: boolean
    retry_after_seconds?: int
    feature_flags: "ClientFeatureFlags"
    disabled_sources: "string[]"
    message?: string              # short localized server-controlled maintenance/update copy; no raw debug text
    incident_id?: string          # non-secret id when maintenance/degraded state is active

  BetaReadinessEvent:
    event_id: uuid
    event_name: string            # app_crash_sanitized | api_recoverable_error | api_unrecoverable_error | action_feed_first_value_visible | beta_aha_action_seen | outbox_stuck | room_migration_failed | data_integrity_violation
    occurred_at: datetime
    app_version_code: int
    app_version_name: string
    build_type: string            # debug | release | internal
    session_id: uuid
    user_id_hash?: string
    source_type?: string
    endpoint?: string
    status_code?: int
    request_id?: string
    incident_id?: string
    reason_code?: string
    retryable?: boolean
    properties?: object           # allowlisted non-PII primitives only

endpoints:
  # ========== RAILWAY — RUNTIME READINESS / CLIENT CONFIG ==========

  - method: GET
    path: /health
    auth: none
    response:
      200:
        status: string            # ok | degraded
        service: string
        environment: string
        process_role: string      # web | worker
        build_sha?: string
        worker_queues?: object
        dependencies?: object     # secret-safe dependency readiness only
      503: "ErrorEnvelope"        # client_action=retry_later|maintenance_wait
    notes:
      - "Android does not block normal cached UI on /health failure, but beta release gates require live health to prove API/Supabase/worker readiness."
      - "Response must not include secrets, DSNs, tokens, raw provider ids, or user data."
    spec_refs: [BETA-001, BETA-008]

  - method: GET
    path: /v1/client_config
    auth: optional
    query:
      platform: string            # android
      version_code: int
      version_name?: string
      locale?: string
    response:
      200: "ClientRuntimeConfigResponse"
      401: "ErrorEnvelope"        # optional auth; authenticated fetch may return login but anonymous safe config must still be available
      429: "ErrorEnvelope"        # client_action=retry_later
      503: "ErrorEnvelope"        # client_action=maintenance_wait|retry_later
    notes:
      - "Android fetches this on cold start, login, foreground, and every 6h while authenticated."
      - "If config fetch fails, Android uses last good config or baked-in safe defaults; it must not blank the app."
      - "force_upgrade=true or min_supported_version_code > current build routes to update-required UI and stops background writes except telemetry/session cleanup."
      - "Feature disable returns disabled-with-reason UI state. It must not revive local action generation."
    spec_refs: [BETA-007, ERR-019]

  - method: POST
    path: /v1/product_events/batch
    auth: optional
    idempotency: event_id
    body:
      events: "BetaReadinessEvent[]"
    constraints:
      max_batch_size: 100
      max_body_bytes: 262144
      privacy: "allowlisted non-PII properties only"
    response:
      200:
        acknowledged: int
      202:
        accepted: int
      400: "ErrorEnvelope"        # client_action=fix_input|discard_local_mutation
      401: "ErrorEnvelope"        # client_action=login for authenticated-only events; anonymous crash/config events may be accepted
      413: "ErrorEnvelope"        # client_action=fix_input
      422: "ErrorEnvelope"        # client_action=fix_input|discard_local_mutation
      429: "ErrorEnvelope"        # client_action=retry_later
      503: "ErrorEnvelope"        # client_action=retry_later
    notes:
      - "This endpoint is the beta readiness telemetry mirror. Losing telemetry must not block user workflows, but failed batches remain bounded and retried/drop-reported without crashing."
      - "Server validates property depth/size and PII allowlist. Android must sanitize before enqueue."
      - "Duplicate event_id is idempotent."
    spec_refs: [BETA-008, BETA-009, BETA-012]

  # ========== SUPABASE AUTH (client calls directly) ==========

  - method: POST
    path: https://<supabase-project>.supabase.co/auth/v1/token
    auth: none
    body:
      grant_type: string      # "password" | "refresh_token" | "id_token"
      email?: string
      password?: string
      refresh_token?: string
      id_token?: string       # Google OAuth
    response:
      200: { access_token: string, refresh_token: string, user: { id: uuid, email: string } }
      400: { error: string, error_description: string }
    spec_refs: [AUTH-001, AUTH-002, AUTH-003, AUTH-004, AUTH-007]

  - method: POST
    path: https://<supabase-project>.supabase.co/auth/v1/logout
    auth: required
    response:
      204: {}
      401: { error: string, message: string }
    spec_refs: [AUTH-005]

  # ========== RAILWAY — RAW INGESTION EVENTS ==========

  - method: POST
    path: /v1/raw_ingestion_events:batch
    auth: required
    idempotency: client_event_id   # 서버는 (user_id, client_event_id) UNIQUE로 dedupe. 중복 전송은 disposition='duplicate'로 200 반환.
    body:
      events:
        - client_event_id: uuid       # Idempotency key (UUID v4, Android-generated)
          source_type: string         # voice | call_recording | meeting | message_screenshot | manual_text | gmail | outlook_mail | naver_imap | daum_imap | google_calendar | outlook_calendar
                                     # UI label mapping: meeting -> 'Meetings', message_screenshot -> 'Messenger Captures', manual_text -> 'Manual Notes', naver_imap -> 'Naver Email', daum_imap -> 'Daum Email'. SourceStatusStrip/OverallSyncIndicator count 10 user-facing sources: voice, meeting, message_screenshot, manual_text, gmail, outlook_mail, naver_imap, daum_imap, google_calendar, outlook_calendar. call_recording is not a separate status chip.
          source_ref?: string
          counterparty_ref?: string   # Compatibility seed only. New source adapters MUST also send participants[].
          event_title?: string        # voice: MediaStore title / email: subject / calendar: title
          event_snippet?: string      # email: body 앞 ~200 chars / voice: 첫 commitment.quote(<=100 chars). full transcript는 절대 전송되지 않음
          duration_seconds?: int      # voice only
          location?: string           # calendar only
          folder?: string             # email only: inbox | sent
          conversation_ref?: string
          email_body_plain?: string    # transient extraction input; never persisted to raw table
          previous_thread_context?: string
          participants?: "SourceEventParticipantInput[]"
          commitments_extracted_count?: int  # default 0; updated after LLM extraction
          timestamp: datetime
    constraints:
      max_batch_size: 100              # events[] 길이. 초과 시 413.
      max_body_bytes: 1048576          # 1 MiB. 초과 시 413.
    response:
      200:
        results: "BatchWriteResult[]"
        failed: "FailedEvent[]"
        # results[] 각 원소는 이미 user-scoped durable commit 완료된 row만 포함한다.
        # Android는 results[].client_event_id 기준으로만 Room sync_status='synced' 전이 가능.
      400: { error: string, message: string }               # 잘못된 JSON / 필수 필드 누락 / body events=[]
      401: { error: string, message: string }               # 토큰 없음/만료 — AUTH-007 refresh 트리거
      413: { error: string, message: string }               # max_batch_size 또는 max_body_bytes 초과 — client chunk 후 재전송
      422: { error: string, message: string }               # 전체 스키마 검증 실패(개별 이벤트가 아닌 batch 수준)
      429: { error: string, message: string }               # Retry-After 헤더 존중
      500: { error: string, message: string }               # 서버 내부 오류 — retryable
      503: { error: string, message: string }               # 일시적 downstream 장애 — retryable
    spec_refs: [ING-003, ING-004, ING-005, ING-011, ING-012, ING-013, SYNC-001, SYNC-002, SYNC-003, SYNC-005, SYNC-006]

  # ========== RAILWAY — SOURCE EXTRACTION (source content → structured items) ==========

  - method: POST
    path: /v1/extractions/commitments
    auth: required
    content_type: multipart/form-data
    idempotency: client_event_id   # 동일 raw event에 대한 추출 재시도 dedupe 키. 이 endpoint는 draft extraction only이며 DB write authority를 갖지 않는다.
    body:
      input_modality: string       # audio | image | transcript | email | text
      source_type: string          # voice | call_recording | meeting | message_screenshot | manual_text | gmail | outlook_mail | naver_imap | daum_imap | google_calendar | outlook_calendar
      audio?: binary               # input_modality=audio only. .m4a/.mp4/.aac/.mp3/.wav. 서버는 파일시스템/Supabase Storage에 저장하지 않음
      image?: binary               # input_modality=image only. .png/.jpg/.jpeg/.webp. 서버는 파일시스템/Supabase Storage에 저장하지 않음
      body_text?: string           # input_modality=transcript/email/text only. request lifetime transient
      client_event_id: uuid        # raw_ingestion_events의 멱등 키와 동일
      raw_event_id: uuid
      duration_seconds?: int       # audio only
      timestamp: datetime
      counterparty_ref?: string
      event_title?: string         # MediaStore TITLE, SAF display name, or meeting file title
      folder?: string              # email only: inbox | sent
      conversation_ref?: string
      previous_thread_context?: string
    constraints:
      max_body_bytes: 62914560     # 60 MiB. 60분 AAC 128kbps 상한. 초과 시 413
      max_image_bytes: 10485760    # 10 MiB. 초과 시 413
      max_duration_seconds: 7200   # 120분. 초과 시 422 — client가 파일 분할 후 재업로드
      max_text_bytes: 10485760
    response:
      200:
        raw_event_id: uuid
        items: "SourceExtractedItem[]"
        source_event_participants: "SourceEventParticipantInput[]" # canonical participant signal output for person matching
        model: string                        # "gemini-2.5-flash"
        region: string                       # "us-central1"
        raw_model_text?: string
      400: { error: string, message: string }    # 멀티파트 파싱 실패, 필수 필드 누락
      401: { error: string, message: string }    # JWT 만료 — AUTH-007 refresh 트리거
      403: { error: string, message: string }    # pipa_third_party_consent 서버측 감사 실패 (클라이언트 guard와 defense-in-depth)
      413: { error: string, message: string }    # max_body_bytes 초과 — client는 즉시 quarantine
      422: { error: string, message: string }    # max_duration_seconds 초과 또는 오디오 디코딩 실패 — retryable:false
      429: { error: string, message: string }    # Vertex AI quota 한도 도달 — Retry-After 존중
      500: { error: string, message: string }    # Railway 내부 오류 — retryable
      502:
        error: string              # "output_truncated" | "schema_violation" | "vertex_upstream_error"
        message: string
        retryable?: boolean
        client_action?: string     # review_quarantine | retry_later
        # output_truncated: Gemini finish_reason=MAX_TOKENS 또는 JSON 파싱 실패 — 단일 호출로 처리 불가. raw_event는 quarantine되며 ERR-005 review_quarantine 경로로 사용자가 repair/discard한다.
        # schema_violation: responseSchema 미준수(enum/필수필드 위반)
      503: { error: string, message: string }    # Vertex AI 일시 downstream 장애 — retryable
    notes:
      - "서버는 Vertex AI 호출을 us-central1 엔드포인트로 수행하고 ZDR(Zero Data Retention) 정책을 적용한다"
      - "오디오 바이트·이미지 바이트·body_text·Gemini 응답은 요청 핸들러 스코프 내에서만 존재하며 Postgres·파일시스템·Supabase Storage·애플리케이션 로그에 영속화되지 않는다"
      - "이 endpoint는 draft extraction only다. Railway는 commitments/raw_ingestion_events를 직접 write하지 않고, Android가 응답을 받아 로컬 Room을 먼저 갱신한 뒤 별도 batch mirror로 서버에 반영한다"
      - "source_type은 multipart body에 포함한다. Android는 raw_event.source_type을 그대로 전달하고, returned items를 해당 source_type commitment로 저장한다"
      - "미팅 전사본(.txt/.md)은 같은 endpoint를 input_modality=transcript + body_text로 호출한다. full transcript 저장은 금지된다"
      - "메신저 캡처(.png/.jpg/.jpeg/.webp)는 Android에서 OCR용 정규화 JPEG(max_width=1440px, max_pixels=8,000,000, quality=82, output<=10MiB)로 변환한 뒤 같은 endpoint를 input_modality=image + image part로 호출한다. OCR text와 image bytes 저장은 금지된다"
      - "오디오 처리 전략: 청크 분할 없이 전체 파일을 단일 Gemini 호출로 전달 — cross-boundary commitment와 화자 맥락 손실 방지. max_duration_seconds=7200(120분) 상한은 단일 호출 안전 범위(입력 1M 토큰 / 출력 8192 토큰 여유)를 기준으로 설정. 상한 초과는 클라이언트에서 quarantine."
    spec_refs: [VOI-001, VOI-002, VOI-003, VOI-006, VOI-007]

  # ========== RAILWAY — COMMITMENTS ==========

  - method: GET
    path: /v1/commitments
    auth: required
    query:
      cursor?: string         # Opaque cursor for pagination
      limit?: int             # Default 20
      since?: string          # ISO datetime — commitments updated after this time
      person_id?: string      # Filter by canonical person_id through commitment_participants
      source_type?: string    # Optional preview/history filter: gmail | outlook_mail | naver_imap | daum_imap | meeting | voice | ...
      source_connection_id?: string # Optional backend-provider connection scoped preview/debug filter
      item_type?: string      # action | schedule | decision
      direction?: string      # give | take
      action_state?: string   # pending | reminded | followed_up | completed | overdue | cancelled
      include_deleted?: boolean  # default false — deleted_at IS NOT NULL 레코드를 응답에 포함할지 여부. MVP 클라이언트는 항상 false로 호출 (휴지통 UI 없음)
      include_unresolved_counterparty?: boolean # default false for normal list; true for onboarding/activation preview so unresolved but actionable/reviewable items are not hidden.
      preview_mode?: boolean # true allows partial preview rows while backend sync/extraction continues; does not imply source sync terminal completion.
    response:
      200:
        data: "Commitment[]"
        # Commitment type includes: id, user_id, item_type, direction?, schedule_status?, decision_status?, counterparty_raw, counterparty_ref,
        # title, description, quote, source_event_title, source_event_occurred_at,
        # due_at (ISO8601 KST), due_hint, due_is_approximate,
        # action_state, source_type (voice|call_recording|meeting|gmail|outlook_mail|naver_imap|daum_imap|google_calendar|outlook_calendar|manual),
        # UI label mapping: meeting -> 'Meetings', naver_imap -> 'Naver Email', daum_imap -> 'Daum Email'; call_recording remains an internal/raw subtype rather than a separate source-status chip.
        # source_ref, confidence, created_at, updated_at,
        # last_edited_by, last_edited_at, quote_disputed, quote_disputed_at,
        # deleted_at, supersedes_commitment_id
        # 서버는 기본값으로 deleted_at IS NULL 필터를 적용. include_deleted=true인 경우에만 soft-deleted row도 반환.
        cursor: string
        has_more: boolean
        preview_state?: string # complete | partial | pending | empty | blocked
        retry_after_seconds?: int
      401: { error: string, message: string }
    notes:
      - "Activation preview uses source_type/provider filters plus include_unresolved_counterparty=true. It must not hide reviewable items solely because person resolution is pending."
      - "preview_mode=true is a UI value path, not a sync completion proof. Android must keep background sync/extraction running after partial preview."
    spec_refs: [NAP-COMMITMENT-001, NAP-SYNC-001, BREG-003]

  - method: GET
    path: /v1/commitments/{id}
    auth: required
    response:
      200: { data: Commitment }
      401: { error: string, message: string }
      404: { error: string, message: string }
    spec_refs: [NAP-EVIDENCE-001]

  - method: PATCH
    path: /v1/commitments/{id}
    auth: required
    body:
      # 모든 필드 optional — 변경하려는 필드만 포함. 하나 이상의 필드가 제공되어야 함(빈 body는 400).
      action_state?: string    # pending | reminded | followed_up | completed | overdue | cancelled
      title?: string           # 1..200 chars (commitment-edit EDIT-004)
      due_at?: string          # ISO8601 KST +09:00, nullable(null로 명시적 clear 허용)
      due_hint?: string        # LLM 원문 시점 표현 혹은 사용자 입력(nullable)
      due_is_approximate?: boolean
      counterparty_ref?: string # canonicalized counterparty(nullable)
      schedule_status?: string # confirmed | changed | postponed | cancelled | follow_up
      decision_status?: string # approved | rejected | chosen | deferred | ongoing
      direction?: string       # give | take
      quote_disputed?: boolean # true = 이의 제기, false = 해제 (EDIT-005)
      quote_disputed_at?: string  # 서버가 set — client가 보내도 무시(server-generated)
      deleted_at?: string      # ISO8601 — soft delete 시 client가 now() 값 전송(EDIT-006). null 전송은 deleted 복구 허용(post-MVP에서 사용, MVP 클라이언트는 미사용)
      last_edited_at: string   # required — 모든 PATCH 호출에 첨부(클라이언트가 now() 값 전송)
      # 금지: quote(법적 증거, 절대 편집 불가), source_type, source_ref, source_event_title, source_event_occurred_at, confidence, created_at, id, user_id, supersedes_commitment_id, item_type
      #   → 이 중 하나라도 body에 포함되면 422 { error: 'immutable_field', field: '<field>' }.
    response:
      200: { data: Commitment }
      400: { error: string, message: string }  # empty body
      401: { error: string, message: string }
      404: { error: string, message: string }
      422: { error: string, message: string, "field?": string }
      # 422 cases:
      #   - invalid action_state value or illegal transition (server enforces transition matrix; see data-model.yml commitments.action_state comment)
      #   - immutable_field: body에 quote 또는 기타 금지 필드 포함
      #   - validation_failed: title 길이·direction enum·due_at ISO8601·counterparty_ref 정규화 실패
    spec_refs: [NAP-ACTION-001, NAP-ACTION-003, NAP-ACTION-004, EDIT-003, EDIT-005, EDIT-006]

  - method: POST
    path: /v1/commitments
    auth: required
    # manual commitment 생성(manual-commitment.spec.yml MAN-003) 및 EDIT-007 supersede 경로 양쪽에서 사용.
    body:
      id: string               # client-generated UUID v4 (멱등성 키 — ING-015와 동일 패턴)
      item_type: string        # action | schedule | decision
      direction?: string       # item_type=action 일 때만 give | take
      schedule_status?: string # item_type=schedule 일 때만 confirmed | changed | postponed | cancelled | follow_up
      decision_status?: string # item_type=decision 일 때만 approved | rejected | chosen | deferred | ongoing
      title: string            # 1..200 chars
      quote: string            # manual: 1..500 chars(사용자 입력) / supersede: 원본 commitment에서 복사된 verbatim
      source_type: string      # enum. manual = 'manual', supersede = 원본의 source_type 상속
      source_event_title?: string  # manual: null, supersede: 원본값
      source_event_occurred_at: string  # manual: now() at save time, supersede: 원본값
      counterparty_ref?: string
      due_at?: string
      due_hint?: string
      due_is_approximate: boolean
      confidence: float        # manual: 1.0, supersede: 1.0 (사용자 확정)
      supersedes_commitment_id?: string  # EDIT-007에서만 non-null. 서버는 old row.deleted_at을 함께 set(atomic tx)
      last_edited_by: string   # user_id
      last_edited_at: string   # ISO8601
    response:
      201:
        data: Commitment
        disposition: string   # "inserted" | "duplicate". 201은 durable commit 완료를 의미한다
      401: { error: string, message: string }
      409: { error: string, message: string }  # 동일 id 중복 — 멱등 처리로 기존 row 반환 가능(서버 선택) 또는 409
      422: { error: string, message: string, "field?": string }
      # 422 cases:
      #   - invalid_source_type: source_type 값이 enum에 없음
      #   - supersede_target_not_found: supersedes_commitment_id가 존재하지 않거나 다른 user 소유
      #   - validation_failed: title/quote/item_type/subtype 규칙 위반
    spec_refs: [MAN-003, EDIT-007]

  - method: POST
    path: /v1/commitments:batch
    auth: required
    idempotency: id
    body:
      commitments:
        - id: uuid
          item_type: string
          direction?: string
          schedule_status?: string
          decision_status?: string
          counterparty_ref?: string
          title: string
          description?: string
          quote: string
          source_event_title?: string
          source_event_occurred_at: string
          due_at?: string
          due_hint?: string
          due_is_approximate: boolean
          action_state: string
          source_type: string
          source_ref?: string
          confidence: float
          last_edited_by?: string
          last_edited_at?: string
          quote_disputed?: boolean
          quote_disputed_at?: string
          deleted_at?: string
          supersedes_commitment_id?: string
    constraints:
      max_batch_size: 100
      max_body_bytes: 1048576
    response:
      200:
        acknowledged: int
        failed: "FailedEvent[]"
      401: { error: string, message: string }
      413: { error: string, message: string }
      422: { error: string, message: string }
      429: { error: string, message: string }
      500: { error: string, message: string }
      503: { error: string, message: string }
    spec_refs: [SYNC-001, SYNC-002, SYNC-003, SYNC-005, NAP-ACTION-001, NAP-ACTION-003, EDIT-003, EDIT-005, EDIT-006, MAN-003]

  # ========== RAILWAY — PERSON ACTION ITEMS (backend-computed product feed) ==========

  - method: GET
    path: /v1/person_action_items
    auth: required
    query:
      cursor?: string
      snapshot_id?: string     # required with cursor when the previous response had has_more=true
      limit?: int             # Default 50, max 100
      changed_since?: string  # ISO datetime — action rows updated after this time
      surface?: string        # person | schedule | commitment. Filters rows whose surfaces[] contains the value.
      status?: string         # active | completed | dismissed | snoozed | superseded | stale. Default active.
      person_id?: string
      commitment_id?: string
      calendar_event_id?: string
      include_stale?: boolean # default true for offline cache refresh, false for first-screen active-only fetches
    response:
      200: "PersonActionFeedResponse"
      401: "ErrorEnvelope"  # client_action=login
      404: "ErrorEnvelope"  # client_action=upgrade_app|retry_later. Endpoint not enabled; Android may render stale cache but must not locally recompute actions.
      409: "ErrorEnvelope"  # client_action=full_refresh. changed_since is too old/unknown; Android must perform full action-feed refresh.
      429: "ErrorEnvelope"  # client_action=retry_later
      503: "ErrorEnvelope"  # client_action=retry_later|contact_support
    notes:
      - "Railway is the product decision owner for action grouping, urgency, ranking, and generated state."
      - "Android renders Room person_action_item_cache populated only from this endpoint; it must not generate local replacement action rows."
      - "Returned rows are canonical product projections but not canonical source facts. Commitments/calendar/person graph/source rows remain the source-fact truth."
      - "Rows include input_watermark and computed_at so Android can show stale/pending-context state when local-origin source uploads are not yet reflected."
      - "Delta responses are snapshot-consistent: data, deleted_ids, server_watermark, input_watermarks, and recompute_state describe one backend read snapshot."
      - "When has_more=true, response must include snapshot_id and snapshot_expires_at. Follow-up requests pass cursor+snapshot_id; Android advances person_action_sync_state.server_watermark only after the final has_more=false page is transactionally applied."
      - "A cursor without the matching snapshot_id, an expired snapshot_id, or a changed_since outside changed_since_min returns 409 client_action=full_refresh."
      - "Delta page order is updated_at ASC, id ASC for deterministic apply. UI urgency ordering is applied after cache commit and must not define delta cursor order."
      - "Android must apply data and deleted_ids in one Room transaction before persisting server_watermark. A crash before commit must refetch with the previous watermark."
      - "capacity_state is normal unless the person-action-recompute worker is behind SLO or degraded. backlog/degraded responses include backlog_lag_seconds and recovery_actions or incident_id."
      - "changed_since older than changed_since_min or outside the 90-day tombstone window returns 409 client_action=full_refresh; Railway must not serve an incomplete delta."
      - "If recompute_state is stale/degraded, response must include at least one recovery_actions item or an operator-visible incident id in reason_code; no silent stuck state is allowed."
      - "evidence_refs are bounded handles only. Server responses must not include full email bodies, transcripts, OCR text, source_artifacts originals, raw_model_text, filesystem paths, signed URLs, or cloud object paths."
      - "status defaults to active. Completed/dismissed/snoozed/history rows must not repopulate first-screen tabs unless explicitly requested."
      - "When data=[] and Android has no cache, a 200 response includes empty_state so the UI can render caught-up/setup/sync-pending/maintenance state instead of a blank dashboard."
      - "404/503 on fresh install is still recoverable: ErrorEnvelope.client_action must be upgrade_app, retry_later, maintenance_wait, or contact_support; Android must not route to legacy local action generation."
    spec_refs: [NAP-001, NAP-003, NAP-005, NAP-007, NAP-009, NAP-013, NAP-017, NAP-SYNC-003, NAP-SYNC-004, NAP-SYNC-005, ERR-010, ERR-012, ERR-013, ERR-015]

  - method: PATCH
    path: /v1/person_action_items/{id}
    auth: required
    idempotency: client_mutation_id
    body: "PersonActionStatePatch"
    response:
      200:
        data: "PersonActionItem"
      400: "ErrorEnvelope"  # client_action=fix_input|discard_local_mutation
      401: "ErrorEnvelope"  # client_action=login
      404: "ErrorEnvelope"  # client_action=refresh_action. Action absent; Android keeps pending mutation retry/error state, not authoritative local state.
      409: "ErrorEnvelope"  # client_action=refresh_action|discard_local_mutation. idempotency_conflict or stale expected_updated_at.
      422: "ErrorEnvelope"  # client_action=fix_input|discard_local_mutation
      429: "ErrorEnvelope"  # client_action=retry_later
      503: "ErrorEnvelope"  # client_action=retry_later
    notes:
      - "This endpoint is the canonical user action-state mutation for generated person action items."
      - "When a PersonActionItem is backed by a commitment, Railway applies the required commitment action_state change atomically or rejects the mutation."
      - "Duplicate client_mutation_id with the same payload returns the same committed PersonActionItem. Duplicate id with different payload returns 409 idempotency_conflict."
      - "Railway computes and stores a server-side payload_hash in PersonActionMutationLedger before applying side effects. Idempotency is not inferred only from the latest action state row."
      - "Android stores failed/offline mutations in person_action_mutation_queue and retries. It must not treat local queued state as canonical after backend rejection."
      - "Every non-200 response must map to a queue transition: retry later, refetch action, user edit, discard local mutation, or login. A failed queue row without CTA/auto retry is forbidden."
    spec_refs: [NAP-004, NAP-010, NAP-014, NAP-COMMITMENT-002, ERR-011]

  - method: POST
    path: /v1/person_action_items/{id}:feedback
    auth: required
    idempotency: client_mutation_id
    body: "PersonActionFeedback"
    response:
      200:
        data: "PersonActionItem"
      400: "ErrorEnvelope"  # client_action=fix_input|discard_local_mutation
      401: "ErrorEnvelope"  # client_action=login
      404: "ErrorEnvelope"  # client_action=refresh_action
      409: "ErrorEnvelope"  # client_action=refresh_action|discard_local_mutation. idempotency_conflict.
      422: "ErrorEnvelope"  # client_action=fix_input|discard_local_mutation
      429: "ErrorEnvelope"  # client_action=retry_later
      503: "ErrorEnvelope"  # client_action=retry_later
    notes:
      - "Feedback is canonical product correction input. It may create user_corrections, person match review state, or priority feedback before recomputing affected action rows."
      - "Duplicate client_mutation_id with the same payload returns the same committed PersonActionItem. Duplicate id with different payload returns 409 idempotency_conflict."
      - "Railway stores a server-side payload_hash/result in PersonActionMutationLedger before any linked correction or recompute trigger is acknowledged."
      - "Android must not re-rank locally after feedback; it applies the returned backend row or refetches changed rows."
      - "Every non-200 response must map to a queue transition: retry later, refetch action, user edit, discard local mutation, or login. A failed queue row without CTA/auto retry is forbidden."
    spec_refs: [NAP-001, NAP-004, NAP-010, NAP-014, NAP-REL-001, ERR-011]

  # ========== RAILWAY — SOURCE STATUS ==========

  - method: GET
    path: /v1/source_status
    auth: required
    response:
      200:
        sources:
          - source_type: string   # voice | call_recording | meeting | message_screenshot | gmail | outlook_mail | naver_imap | daum_imap | google_calendar | outlook_calendar
            state: string         # legacy sync projection: idle | syncing | synced | error
            sync_state: string    # idle | syncing | synced | error
            connection_state: string # connected | never_connected | needs_reauth | client_managed
            last_sync_at?: datetime
            last_error?: string
        # state는 이전 Android 호환을 위해 유지한다. 새 Android는 sync_state를 우선 사용한다.
        # connection_state=client_managed 또는 필드 누락 source는 기존 local-derived 값으로 유지한다.
      401: { error: string, message: string }
      500: { error: string, message: string }
      503: { error: string, message: string }
    spec_refs: [NAP-SYNC-002, SMG-001, SMG-002, ERR-002, ERR-003]

  # ========== RAILWAY — CALENDAR EVENTS ==========

  - method: GET
    path: /v1/calendar_events
    auth: required
    query:
      cursor?: string
      since?: string          # ISO datetime
      limit?: int
      status?: string         # confirmed | cancelled — optional filter. 기본(미지정) 시 양쪽 모두 반환하며 client가 status='cancelled'를 strike-through로 렌더링
    response:
      200: { data: "CalendarEvent[]", cursor: string, has_more: boolean }
      # CalendarEvent includes: id, user_id, source_type, source_ref, title, start_at, end_at, attendees_raw, status (confirmed|cancelled), recurring_event_id, original_start_at
      401: { error: string, message: string }
    spec_refs: [NAP-SCHEDULE-001, ING-009, ING-010]

  - method: POST
    path: /v1/calendar_events:sync
    auth: required
    response:
      200: "SourceSyncTriggerResponse"
      202: "SourceSyncTriggerResponse"
      401: "ErrorEnvelope"
      429: "ErrorEnvelope"
      503: "ErrorEnvelope"
    notes:
      - "accepted/queued/running is not synced. Android waits for terminal succeeded or source_status mirror before marking source synced."
      - "retry_after_seconds drives polling/backoff; foreground polling has a bounded budget."
    spec_refs: [NAP-SCHEDULE-001, BREG-002]

  # ========== RAILWAY — MAIL ==========

  - method: POST
    path: /v1/mail_sources:sync
    auth: required
    query:
      provider?: string       # gmail | outlook_mail. Omit for backend default/all enabled mail sources.
    response:
      200: "SourceSyncTriggerResponse"
      202: "SourceSyncTriggerResponse"
      401: "ErrorEnvelope"
      429: "ErrorEnvelope"
      500: "ErrorEnvelope"
      503: "ErrorEnvelope"
    notes:
      - "OAuth callback success only proves browser/token return. This endpoint accepts or observes backend provider sync; Android must not treat accepted/queued/running as source synced."
      - "Active job reuse must return current job_id/status/sync_mode progress so preview-mode requests are not blocked behind opaque full-sync jobs."
    spec_refs: [ING-006, ING-007, SMG-005, BREG-002, BREG-003]

  - method: GET
    path: /v1/oauth/mail/{provider}:start
    auth: required
    response:
      200: "MailOAuthStart"
      401: { error: string, message: string }
      404: { error: string, message: string }
      503: { error: string, message: string }
    notes:
      - "provider는 gmail | outlook_mail"
      - "Android는 반환된 authorization_url을 외부 브라우저/Custom Tab으로 연다"
    spec_refs: [ONB-004, SMG-003]

  - method: GET
    path: /v1/oauth/mail/{provider}:status
    auth: required
    response:
      200: "MailOAuthStatus"
      401: { error: string, message: string }
      404: { error: string, message: string }
    notes:
      - "callback 이후 user_mail_connections 존재 여부를 Android가 polling하는 최소 external integration surface"
      - "connected=true is connection durability only. Android must still observe sync_state/job_id or source_status before showing synced."
    spec_refs: [ONB-004, SMG-003, BREG-002]

  - method: GET
    path: /v1/oauth/calendar/{provider}:start
    auth: required
    response:
      200: "CalendarOAuthStart"
      401: { error: string, message: string }
      404: { error: string, message: string }
      503: { error: string, message: string }
    notes:
      - "provider는 google_calendar | outlook_calendar"
      - "Android는 반환된 authorization_url을 외부 브라우저/Custom Tab으로 연다"
    spec_refs: [ONB-001, SMG-003]

  - method: GET
    path: /v1/oauth/calendar/{provider}:status
    auth: required
    response:
      200: "CalendarOAuthStatus"
      401: { error: string, message: string }
      404: { error: string, message: string }
    notes:
      - "callback 이후 user_calendar_connections 존재 여부를 Android가 polling하는 최소 external integration surface"
      - "connected=true is connection durability only. Android must still observe sync_state/job_id or source_status before showing synced."
    spec_refs: [ONB-001, SMG-003, BREG-002]

  # ========== RAILWAY — RELATION INTELLIGENCE / PERSONS ==========

  - method: GET
    path: /v1/source_event_participants
    auth: required
    query:
      cursor?: string
      limit?: int             # Default 20
      since?: string          # ISO-8601 created_at lower bound
      source_type?: string
    response:
      200: { data: "SourceEventParticipant[]", cursor: string, has_more: boolean }
      401: { error: string, message: string }
    notes:
      - "Canonical backend source-person relation feed. Android mirrors this into Room source_event_participants; no source_person_candidates compatibility cache is part of the active contract."
    spec_refs: [NAP-REL-001, NAP-REL-002]

  - method: GET
    path: /v1/commitment_participants
    auth: required
    query:
      cursor?: string
      limit?: int             # Default 20
      since?: string          # ISO-8601 created_at lower bound
      person_id?: string
      commitment_id?: string
    response:
      200: { data: "CommitmentParticipant[]", cursor: string, has_more: boolean }
      401: { error: string, message: string }
    notes:
      - "Canonical backend commitment-person edge feed. Android mirrors this into Room commitment_participants before running PersonInteractionIndexWorker."
    spec_refs: [NAP-REL-001, NAP-REL-002]

  - method: GET
    path: /v1/persons
    auth: required
    query:
      cursor?: string
      limit?: int             # Default 20
      q?: string              # Substring search on display_name, email, phone
    response:
      200: { data: "Person[]", cursor: string, has_more: boolean }
      401: { error: string, message: string }
    notes:
      - "Returns first-class persons rows aggregated with person_interactions and commitment_participants. Response identity key is `person_id`; no `person_ref` alias is part of the current Android contract."
    spec_refs: [NAP-REL-001]

  - method: GET
    path: /v1/persons/{person_id}/events
    auth: required
    query:
      cursor?: string
      limit?: int
    response:
      200: { data: "RawIngestionEvent[]", cursor: string, has_more: boolean }
      401: { error: string, message: string }
      404: { error: string, message: string }
    spec_refs: [NAP-EVIDENCE-001, NAP-REL-002]

  - method: GET
    path: /v1/persons/{person_id}/commitments
    auth: required
    query:
      cursor?: string
      limit?: int
    response:
      200: { data: "Commitment[]", cursor: string, has_more: boolean }
      401: { error: string, message: string }
      404: { error: string, message: string }
    spec_refs: [NAP-EVIDENCE-001, NAP-REL-002]

  - method: PUT
    path: /v1/persons/{person_id}/memory
    auth: required
    content_type: application/json
    body:
      schema_version: 2
      content_markdown: string       # validated person memory Markdown, max 64 KiB UTF-8
      content_hash: string           # sha256 hex of canonical Markdown bytes after replacing frontmatter content_hash with 64 zeroes
      generated_at: datetime
      source_window_from?: datetime
      source_window_to?: datetime
    constraints:
      max_body_bytes: 131072
      max_markdown_bytes: 65536
    response:
      200:
        bucket: person-memory
        object_path: string          # "{user_id}/{person_id}/memory.md"
        person_id: uuid
        content_hash: string
        generated_at: datetime
      400: { error: string, message: string }
      401: { error: string, message: string }
      404: { error: string, message: string }
      422: { error: string, message: string }  # frontmatter/path/person_id/hash mismatch or validation failure
      503: { error: string, message: string }  # Supabase Storage unavailable; Android retries asynchronously
    notes:
      - "Android ProfileMemoryWorker generates memory.md from structured Room data and uploads through Railway; Android must not write Supabase Storage directly."
      - "Railway writes Supabase Storage bucket `person-memory` object `{user_id}/{person_id}/memory.md` with metadata user_id, person_id, schema_version, content_hash, generated_at."
      - "No Supabase table is created for person memory. It is a derived business-context artifact, not canonical person data and not a UI source of truth."
      - "content_markdown must not include full email body, full transcript, source_artifacts original Markdown, audio transcript, or raw_model_text."
      - "Decision commitments are consumed here as compact relationship facts using decision_status, not action_state."
      - "Backend PersonActionItem computation may use structured semantic-index/context signals from the same inputs, but Android UI must not parse memory.md content at runtime."
      - "UI rendering, source ingestion, person matching, person_interactions rebuild, and backend action recomputation must not depend on upload success."
    spec_refs: [PMEM-001, PMEM-002, PMEM-003, PMEM-004, PMEM-005, PMEM-008]

  - method: GET
    path: /v1/persons/{person_id}/memory
    auth: required
    response:
      200:
        bucket: person-memory
        object_path: string
        person_id: uuid
        content_markdown: string
        content_hash: string
        generated_at: datetime
      401: { error: string, message: string }
      404: { error: string, message: string }  # person or memory artifact absent
      503: { error: string, message: string }
    notes:
      - "Reserved for cross-device restore/future assistant context. Android UI remains action-cache-first and may ignore missing remote memory."
      - "Response content is not parsed by runtime tab projections. It can be displayed as optional context or used offline to rebuild bounded semantic-index inputs after explicit restore."
    spec_refs: [PMEM-001, PMEM-005]

  # ========== RAILWAY — USER PROFILE ==========

  - method: GET
    path: /v1/user_profile
    auth: required
    response:
      200:
        data:
          user_id: uuid
          display_name_override?: string
          phone_e164_self?: string
          timezone: string                  # default "Asia/Seoul"
          preferred_locale: string          # default "ko"
          created_at: datetime
          updated_at: datetime
      401: { error: string, message: string }
      404: { error: string, message: string }   # 로그인 직후 첫 호출 시 — 클라이언트가 PATCH로 upsert
    spec_refs: [PIPA-001, VOI-008]

  - method: PATCH
    path: /v1/user_profile
    auth: required
    body:
      display_name_override?: string
      phone_e164_self?: string             # E.164. 서버는 정규식 ^\+[1-9]\d{7,14}$ 로 검증
      timezone?: string                    # IANA tz
      preferred_locale?: string
    response:
      200: { data: UserProfile }
      401: { error: string, message: string }
      422: { error: string, message: string }  # phone_e164_self 포맷 오류 / timezone IANA 미등록
    spec_refs: [PIPA-001, VOI-008]
